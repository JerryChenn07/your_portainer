version: '3.2'

services:
  agent:
    image: portainer/agent:2.19.1
    ports:
      - "9001:9001"
    volumes:
      # 注意修改此处挂载路径
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/docker/volumes:/var/lib/docker/volumes
    networks:
      - agent_network
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]

networks:
  agent_network:
    driver: overlay
    attachable: true
